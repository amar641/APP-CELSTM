version: 1
disable_existing_loggers: false

formatters:
  json:
    format: "%(message)s"
  plain:
    format: "%(asctime)s %(levelname)-8s %(name)s: %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    formatter: plain
    stream: ext://sys.stdout

root:
  level: INFO
  handlers: [console]

loggers:
  industrial_fire:
    level: INFO
    handlers: [console]
    propagate: false
  sqlalchemy.engine:
    level: WARNING
    handlers: [console]
    propagate: false
  uvicorn:
    level: INFO
    handlers: [console]
    propagate: false
