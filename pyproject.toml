[project]
name = "industrial-fire-ai"
version = "0.1.0"
description = "AI-based detection and classification of industrial fires and persistent thermal sources using NASA FIRMS, OSM, weather, and satellite data."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "httpx>=0.27.2",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "sqlalchemy>=2.0.35",
    "geoalchemy2>=0.15.2",
    "psycopg[binary]>=3.2.2",
    "alembic>=1.13.3",
    "qdrant-client>=1.11.2",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "scikit-learn>=1.5.2",
    "xgboost>=2.1.0",
    "joblib>=1.4.2",
    "numpy>=1.26.4",
    "geopandas>=1.0.1",
    "shapely>=2.0.6",
    "rasterio>=1.3.11",
    "pystac-client>=0.8.3",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/industrial_fire"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
packages = ["industrial_fire"]
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.uv]
dev-dependencies = []
